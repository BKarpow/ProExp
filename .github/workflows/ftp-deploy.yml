name: Deploy Website via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Generate Vendor & Deploy
    runs-on: ubuntu-latest

    steps:
    # 1. Отримуємо код з репозиторію
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Налаштовуємо PHP для Composer
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Вкажи версію PHP свого проєкту
        extensions: mbstring, xml, ctype, iconv, mysql, zip

    # 3. Встановлюємо залежності Composer (папку vendor)
    - name: 📦 Install Composer dependencies
      run: |
        composer install --no-dev --optimize-autoloader --no-progress --no-interaction

    # 4. Деплоїмо все на хостинг
    - name: 🚀 Upload files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # server-dir: /public_html/ # Розкоментуй, якщо потрібно вказати конкретну папку
        server-dir: /core2/prm/
